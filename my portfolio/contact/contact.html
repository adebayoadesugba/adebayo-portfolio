  <main>
    <h1 class="contact-title">ESTABLISH CONNECTION</h1>
    
    <form class="contact-form" id="ps4-contact-form">
      <div class="input-group">
        <label for="name">ID / Name</label>
        <input type="text" id="name" name="name" class="form-control" placeholder="Enter your name" required>
      </div>
      
      <div class="input-group">
        <label for="email">Comms Link / Email</label>
        <input type="email" id="email" name="email" class="form-control" placeholder="Enter your email" required>
      </div>
      
      <div class="input-group">
        <label for="message"> Message</label>
        <textarea id="message" name="message" class="form-control" rows="5" placeholder="Type your message here..." required></textarea>
      </div>

      <button type="submit" class="submit-btn" id="send-btn">Send Message</button>
    </form>
  </main>

  <div class="action-prompt" id="action-prompt">
    <div class="btn-circle">O</div>
    <span>BACK</span>
  </div>
